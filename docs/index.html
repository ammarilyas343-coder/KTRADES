<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="K Trade — classroom stock-trading competition terminal.">
  <title>K Trade</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot">
      <img class="boot-logo" src="logo.png" alt="K Trade" width="72" height="72">
      <div class="boot-mark">K<span>Trade</span></div>
      <div class="boot-line">Loading terminal…</div>
      <noscript class="boot-line">K Trade needs JavaScript enabled.</noscript>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="js/config.js" defer></script>
  <script src="js/demo.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/format.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/views/shell.js" defer></script>
  <script src="js/views/login.js" defer></script>
  <script src="js/views/change-password.js" defer></script>
  <script src="js/views/home.js" defer></script>
  <script src="js/views/portfolio.js" defer></script>
  <script src="js/views/trade.js" defer></script>
  <script src="js/views/board.js" defer></script>
  <script src="js/views/profile.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
